name: onion_guard
description: OnionGuard - AI-Powered Onion Disease Detection for Farmers
publish_to: 'none'
version: 1.2.0+9

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  http_parser: ^4.0.0
  provider: ^6.1.0
  shared_preferences: ^2.2.0
  image_picker: ^1.0.0
  path_provider: ^2.1.0
  local_auth: ^2.2.0
  intl: ^0.19.0
  audioplayers: ^6.0.0
  connectivity_plus: ^6.0.0
  sqflite: ^2.3.0
  google_fonts: ^6.1.0
  tflite_flutter: ^0.12.0
  image: ^4.3.0
  fl_chart: ^0.68.0
  flutter_dotenv: ^5.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/onion-image.jpg"
  adaptive_icon_background: "#4CAF50"
  adaptive_icon_foreground: "assets/onion-image.jpg"

flutter:
  uses-material-design: true
  assets:
    - assets/models/
    - assets/onion-image.jpg
    - .env
